[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adjoint-faithful-fno"
version = "0.1.0"
description = "Adjoint-faithful Fourier neural operators for the MITgcm baroclinic double gyre"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "AF-FNO project contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "xarray>=2024.3",
  "dask[array]>=2024.3",
  "zarr>=2.18,<3",
  "numcodecs>=0.12,<0.16",
  "xmitgcm>=0.5.2,<0.6",
  "matplotlib>=3.8,<4",
  "pandas>=2.2,<3",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
fno = [
  "torch>=2.5,<2.7",
  "neuraloperator==2.0.0",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
af-fno = "bire_repro.cli:main"
repro = "bire_repro.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
